services:
  nest:
    build: .
    # Or use a prebuilt image if you publish one:
    # image: ghcr.io/<you>/nest:latest
    container_name: nest
    restart: unless-stopped
    ports:
      # host:container - change the left side to use another port on the Pi.
      - "${NEST_PORT:-8080}:8080"
    environment:
      # Uncomment both to require a username/password (HTTP Basic auth).
      # NEST_AUTH_USER: admin
      # NEST_AUTH_PASSWORD: change-me
      TZ: ${TZ:-UTC}
    volumes:
      # Persistent configuration (config.json lives here).
      - nest-data:/data
      # Prefer a folder on the host instead? Replace the line above with:
      # - ./data:/data
      # and run `mkdir -p data && sudo chown 1000:1000 data` once.
    security_opt:
      - no-new-privileges:true

volumes:
  nest-data:
