services:
  nest:
    build: .
    # Or use a prebuilt image if you publish one:
    # image: ghcr.io/flaaaps/nest:latest
    container_name: nest
    restart: unless-stopped
    ports:
      # host:container - NEST is served on port 80 of the host by default so the
      # dashboard is reachable at http://raspberrypi.local without a port.
      # Set NEST_PORT in .env to change the host port. The container always
      # listens on 8080 internally.
      #
      # Rootless Podman/Docker cannot bind ports below 1024 unless you allow it
      # once on the host (see README, "Choosing the port"):
      #   sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
      - "${NEST_PORT:-80}:8080"
    environment:
      # Uncomment both to require a username/password (HTTP Basic auth).
      # NEST_AUTH_USER: admin
      # NEST_AUTH_PASSWORD: change-me
      TZ: ${TZ:-UTC}
    volumes:
      # Persistent configuration (config.json lives here).
      - nest-data:/data
      # Prefer a folder on the host instead? Replace the line above with:
      # - ./data:/data
      # and run `mkdir -p data && sudo chown 1000:1000 data` once
      # (with rootless Podman use `podman unshare chown 1000:1000 data`).
    security_opt:
      - no-new-privileges:true

volumes:
  nest-data:
